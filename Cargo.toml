# Release builds wrap on integer overflow by default (Cargo profiles reference). Amounts must
# never wrap silently: our crates panic instead, and launchd/compose restart the process.
[profile.release.package.amnesia-core]
overflow-checks = true

[profile.release.package.amnesia-desk]
overflow-checks = true

[profile.release.package.amnesia-lab]
overflow-checks = true
